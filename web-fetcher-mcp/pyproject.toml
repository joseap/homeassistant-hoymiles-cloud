[project]
name = "hoymiles-mcp"
version = "0.1.0"
description = "MCP server for Hoymiles S-Miles Cloud - monitor and control solar plants"
requires-python = ">=3.11"
dependencies = [
    "mcp>=1.0.0",
    "httpx>=0.27.0",
]

[project.scripts]
hoymiles-mcp = "web_fetcher_mcp.server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/web_fetcher_mcp"]
